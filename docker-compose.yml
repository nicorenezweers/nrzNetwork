# Beispiel: docker compose up -d → Oberfläche auf http://localhost:8380, DNS auf Port 53.
# Das erste Konto, das du anlegst, wird Administrator.
# Port 53 muss auf dem Rechner frei sein (kein Pi-hole, AdGuard Home, dnsmasq oder
# systemd-resolved mit DNSStubListener auf 0.0.0.0:53).
services:
  nrzdns:
    image: ghcr.io/nicorenezweers/nrz-dns:1.15.0
    # Selbst bauen statt das fertige Image zu holen (vorher `cargo xtask dockerfile > Dockerfile`):
    # build: .
    container_name: nrzdns
    restart: unless-stopped
    ports:
      - "53:53/udp"
      - "53:53/tcp"
      - "8380:8380"
      # Reverse Proxy (HTTP): music.nrz.ch → http://100.78.107.162:8350 usw.
      - "80:80"
      # HTTPS für eigene Domains (Let's Encrypt über Cloudflare, in der Oberfläche einrichten)
      - "443:443"
    environment:
      TZ: Europe/Zurich
      # Hinter HTTPS (Reverse Proxy) einschalten:
      NRZDNS_COOKIE_SECURE: "false"
      # DNS-Adressen im Container, durch Kommas getrennt:
      # NRZDNS_DNS_LISTEN: "0.0.0.0:53,[::]:53"
      # Adressen des Reverse Proxys (leer = aus):
      # NRZDNS_PROXY_LISTEN: "0.0.0.0:80"
      # HTTPS-Eingang (leer = aus):
      # NRZDNS_PROXY_TLS_LISTEN: "0.0.0.0:443"
      # Zeitzone für die Update-Uhrzeit der Komponenten (Cloudflare Tunnel, NetBird):
      # TZ: Europe/Zurich
    volumes:
      # nrzdns.db: Konten, Einstellungen, Zonen, Sperrlisten, Abfrageprotokoll – alles in einer Datei
      - nrzdns-data:/data
      # Docker-Seite (alle Container, interne IPs, Logs – nur lesend); der Benutzer im
      # Container braucht dafür Leserechte auf den Socket (z. B. group_add mit der docker-GID):
      # - /var/run/docker.sock:/var/run/docker.sock:ro
    # Das Image läuft als Benutzer 1000. Port 53 darf er dank dieser Einstellung öffnen
    # (Docker setzt sie seit 20.10 ohnehin), ganz ohne zusätzliche Rechte.
    sysctls:
      net.ipv4.ip_unprivileged_port_start: 0
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

volumes:
  nrzdns-data:
